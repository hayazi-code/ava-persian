e-result" hidden aria-live="polite"><span id="game-feedback"></span><small id="game-answer"></small><button id="game-next" class="primary">بعدی ←</button></div></section><section class="card" id="card"><div class="emoji" id="emoji"></div><div class="fa" id="fa"></div><div class="sentences"><div id="s1"></div><div id="s2"></div></div><div class="translations"><div><small>Español</small><b id="es"></b></div><div><small>English</small><b id="en"></b></div><div dir="rtl"><small>العربية</small><b id="ar"></b></div><div><small>Français</small><b id="fr"></b></div></div></section><nav class="controls" aria-label="پخش"><button id="prev" class="nav-btn" aria-label="قبلی">◀</button><button id="play" class="primary play-btn">▶ پخش</button><button id="next" class="nav-btn" aria-label="بعدی">▶</button></nav><div class="utility"><span id="counter"></span><button id="settings" aria-expanded="false">⚙ تنظیمات</button><button id="search">⌕ جست‌وجو</button></div><div class="settings-panel" id="settings-panel" hidden><label>زمان هر کارت (ثانیه) <input type="number" id="sec" min="2" max="120" value="10"></label><button id="random">⇄ پخش تصادفی</button><p>در حالت آوا، ترجمه‌ها و ابزارهای اضافی پنهان می‌شوند.</p></div></main><section class="editor" id="editor" dir="rtl"><nav><button id="close">بستن ✕</button><button id="save" class="primary">ذخیره</button><button id="add">+ واژه</button><button id="export">دریافت JSON</button></nav><p>تغییرات فقط در همین مرورگر ذخیره می‌شوند. برای پشتیبان‌گیری JSON را دریافت کنید.</p><div id="fields"></div><label>بارگذاری مجموعه JSON <input id="import" type="file" accept=".json"></label></section><script>const original=[{"emoji":"🍎","fa":"سیب","sentence1":"سیبِ سرخ روی میز است.","sentence2":"سیب را می‌شوییم و به چند تکه می‌بُریم.","es":"manzana","en":"apple","ar":"تفاحة","fr":"pomme"},{"emoji":"🍌","fa":"موز","sentence1":"پوستِ موز را پیش از خوردن می‌کنیم.","sentence2":"موزِ رسیده نرم و شیرین است.","es":"plátano","en":"banana","ar":"موز","fr":"banane"},{" const gameCategory=new Map(gameGroups.flatMap((g,n)=>g.map(e=>[e,n])));
let gameRound=0,gameQueue=[],gameAnswer=null,gameLocked=false;
const gameRandom=a=>a[Math.floor(Math.random()*a.length)];
function gameShuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function gamePool(){return items.filter(c=>c&&c.emoji&&c.fa&&typeof c.emoji==='string'&&typeof c.fa==='string')}
function gameNextQuestion(){
 const pool=gamePool();if(pool.length<3){alert('برای بازی دست‌کم سه واژه لازم است.');gameExit();return}
 if(!gameQueue.length)gameQueue=gameShuffle(pool.slice());
 const target=gameQueue.pop();gameAnswer=target;gameLocked=false;
 const others=pool.filter(c=>c.emoji!==target.emoji);
 const category=gameCategory.get(target.emoji);
 const related=category===undefined?[]:others.filter(c=>gameCategory.get(c.emoji)===category);
 // 1–3: unrelated choices; 4–7: one related; 8+: two related where available.
 const relatedCount=gameRound<3?0:gameRound<7?1:2;
 const picks=gameShuffle(related.slice()).slice(0,relatedCount);
 const unrelated=others.filter(c=>!picks.includes(c)&&(category===undefined||gameCategory.get(c.emoji)!==category));
 picks.push(...gameShuffle(unrelated).slice(0,2-picks.length));
 if(picks.length<2)picks.push(...gameShuffle(others.filter(c=>!picks.includes(c))).slice(0,2-picks.length));
 const choices=gameShuffle([target,...picks]);
 $('game-prompt').textContent='«'+target.fa+' کجاست؟»';
 $('game-progress').textContent='پرسش '+(gameRound+1)+' · '+(gameRound<3?'آسان':gameRound<7?'متوسط':'پیشرفته');
 $('game-hint').textContent='از آوا بپرسید و بگذارید خودش انتخاب کند.';
 $('game-result').hidden=true;
 const holder=$('game-options');holder.replaceChildren();
 for(const c of choices){
  const b=document.createElement('button');b.type='button';b.className='game-option';b.textContent=c.emoji;
  b.setAttribute('aria-label','گزینه '+(holder.children.length+1));
  b.onclick=()=>gameChoose(c,b);holder.append(b)
 }
 gameRound++;
}
function gameChoose(c,button){
 if(gameLocked)return;gameLocked=true;
 const yes=c.emoji===gameAnswer.emoji;
 for(const b of $('game-options').children){
  b.disabled=true;
  if(b.textContent===gameAnswer.emoji)b.classList.add('correct');
 }
 if(!yes)button.classList.add('wrong');
 $('game-feedback').textContent=yes?'آفرین! درست پیدا کردی! 🌟':'اشکالی ندارد، با هم یاد می‌گیریم. 💚';
 $('game-answer').textContent=gameAnswer.emoji+' '+gameAnswer.fa;
 $('game-result').hidden=false;
 $('game-next').focus({preventScroll:true});
}
function gameExit(){document.body.classList.remove('game-active');$('game-screen').hidden=true;render()}
$('game-launch').onclick=()=>{
 if(playing){clearInterval(playing);playing=null;$('play').textContent='▶ پخش'}
 $('editor').classList.remove('open');document.body.classList.add('game-active');
 $('game-screen').hidden=false;gameRound=0;gameQueue=[];gameNextQuestion()
};
$('game-exit').onclick=gameExit;
$('game-next').onclick=gameNextQuestion;
</script></body></html>
