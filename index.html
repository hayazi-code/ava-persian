i{font-size:clamp(105px,23dvh,215px)!important}.ava-mode .fa{font-size:clamp(42px,9vw,88px)!important}@media(max-width:420px){header strong{font-size:16px!important}.header-actions button{font-size:12px;padding:7px}.card{border-radius:18px}.sentences{font-size:18px!important}.translations b{font-size:clamp(13px,3.6vw,19px)!important}.translations small{font-size:11px!important}.nav-btn{min-width:52px}.play-btn{min-width:115px}}@media(max-height:690px){.emoji{font-size:clamp(65px,14dvh,115px)!important}.card{gap:8px!important}.sentences{font-size:16px!important}.translations{padding-top:6px}.nav-btn,.play-btn{min-height:44px}}</style></head><body><main class="app"><header><strong>آوا | واژه‌های فارسی</strong><div class="header-actions"><button id="mode" aria-pressed="false">👶 حالت آوا</button><button id="edit">✎ ویرایش</button><button id="full" aria-label="تمام صفحه">⛶</button></div></header><section class="card" id="card"><div class="emoji" id="emoji"></div><div class="fa" id="fa"></div><div class="sentences"><div id="s1"></div><div id="s2"></div></div><div class="translations"><div><small>Español</small><b id="es"></b></div><div><small>English</small><b id="en"></b></div><div dir="rtl"><small>العربية</small><b id="ar"></b></div></div></section><nav class="controls" aria-label="پخش"><button id="prev" class="nav-btn" aria-label="قبلی">◀</button><button id="play" class="primary play-btn">▶ پخش</button><button id="next" class="nav-btn" aria-label="بعدی">▶</button></nav><div class="utility"><span id="counter"></span><button id="settings" aria-expanded="false">⚙ تنظیمات</button><button id="search">⌕ جست‌وجو</button></div><div class="settings-panel" id="settings-panel" hidden><label>زمان هر کارت (ثانیه) <input type="number" id="sec" min="2" max="120" value="10"></label><button id="random">⇄ پخش تصادفی</button><p>در حالت آوا، ترجمه‌ها و ابزارهای اضافی پنهان می‌شوند.</p></div></main><section class="editor" id="editor" dir="rtl"><nav><button id="close">بستن ✕</button><button id="save" class="primary">ذخیره</button><button id="add">+ واژه</button><button id="export">دریافت JSON</button></nav><p>تغییرات فقط در همین مرورگر ذخیره می‌شوند. برای پشتیبان‌گیری JSON را دریافت کنید.</p><div id="fields"></div><label>بارگذاری مجموعه JSON <input id="import" type="file" accept=".json"></label></section><script>const original=[{"emoji":"🍎","fa":"سیب","sentence1":"سیبِ سرخ روی میز است.","sentence2":"سیب را می‌شوییم و به چند تکه می‌بُریم.","es":"manzana","en":"apple","ar":"تفاحة"},{"emoji":"🍌","fa":"موز","sentence1":"پوستِ موز را پیش از خوردن می‌کنیم.","sentence2":"موزِ رسیده نرم و شیرین است.","es":"plátano","en":"banana","ar":"موز"},{"emoji":"🍐","fa":"گلابی","sentence1":"گلابیِ رسیده شیرین و آبدار است.","sentence2":"گلابی را می‌توان با پوست خورد.","es":"pera","en":"pear","ar":"كمثرى"},{"emoji":"🍊","fa":"پرتقال","sentence1":"پوستِ پرتقال بوی خوشی دارد.","sentence2":"پرتقال را پوست می‌کنیم و قاچ می‌کنیم.","es":"naranja","en":"orange","ar":"برتقال"},{"emoji":"🍋","fa":"لیمو","sentence1":"آبِ لیمو مزه‌ای ترش دارد.","sentence2":"چند قطره آبِ لیمو در لیوان می‌چکانیم.","es":"limón","en":"lemon","ar":"ليمون"},{"emoji":"🍉","fa":"هندوانه","sentence1":"درونِ هندوانه سرخ و پُرآب است.","sentence2":"یک قاچِ هندوانه را در بشقاب می‌گذاریم.","es":"sandía","en":"watermelon","ar":"بطيخ"},{"emoji":"🍇","fa":"انگور","sentence1":"دانه‌های انگور به خوشه آویزان‌اند.","sentence2":"دانه‌های انگور را پیش از خوردن به اندازهٔ مناسب می‌بُریم.","es":"uvas","en":"grapes","ar":"عنب"},{"emoji":"🍓","fa":"توت‌فرنگی","sentence1":"روی توت‌فرنگی دانه‌های ریزی دیده می‌شود.","sentence2":"توت‌فرنگیِ رسیده بوی خوشی دارد.","es":"fresa","en":"strawberry","ar":"فراولة"},{"emoji":"🍒","fa":"گیلاس","sentence1":"دو گیلاس از ساقه‌هایشان آویزان‌اند.","sentence2":"درونِ گیلاس یک هستهٔ سخت است.","es":"cereza","en":"cherry","ar":"كرز"},{"emoji":"🍍","fa":"آناناس","sentence1":"پوستِ آناناس زبر و خاردار است.","sentence2":"درونِ آناناس زرد و آبدار است.","es":"piña","en":"pineapple","ar":"أناناس"},{"emoji":"🥭","
